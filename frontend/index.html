<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coronary artery disease risk mapping: per-vessel stenosis prediction with TreeSHAP attributions on an interactive 3D anatomical model. Decision support and education only."
    />
    <title>Coronary Risk Mapping</title>
  </head>
  <body>
    <!-- Restore the saved theme before first paint. Doing this in React would
         flash the light default for one frame on a dark-mode user's screen. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
